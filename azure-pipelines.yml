trigger:
  branches:
    include:
      - main
      - dev

pr:
  branches:
    include:
      - main
      - dev

pool:
  vmImage: ubuntu-latest

jobs:
  - job: validate
    displayName: Validate PR conventions
    condition: eq(variables['Build.Reason'], 'PullRequest')
    steps:
      - checkout: self
        fetchDepth: 0
      - script: |
          chmod +x .azure/validate-pr.sh
          bash .azure/validate-pr.sh
        displayName: Run PR validation

  - job: frontend
    displayName: Frontend
    steps:
      - checkout: self

      - task: UseNode@1
        inputs:
          version: "20.x"
        displayName: Install Node.js

      - script: npm ci
        workingDirectory: apps/frontend
        displayName: Install dependencies

      - script: npm run build
        workingDirectory: apps/frontend
        displayName: Build

  - job: backend
    displayName: Backend
    steps:
      - checkout: self

      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.12"
          addToPath: true
        displayName: Install Python

      - script: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        displayName: Install dependencies
        workingDirectory: apps/backend

      - script: python -c "from app import create_app; app = create_app(); print('App created OK')"
        displayName: Verify app factory
        workingDirectory: apps/backend
